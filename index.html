<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONESCALP — Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo{font-family:'Playfair Display',serif;font-size:28px;color:#C9A84C;letter-spacing:5px;text-transform:uppercase;margin-bottom:8px;text-align:center}
.sub{font-size:12px;color:#444;letter-spacing:2px;text-align:center;margin-bottom:3rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:480px}
.card{background:#1A1A1A;border:1px solid #333;border-radius:4px;padding:28px 24px;text-decoration:none;transition:border-color .2s,background .2s;display:block}
.card:hover{border-color:#C9A84C;background:#1F1F1F}
.card-icon{font-size:28px;margin-bottom:12px}
.card-title{font-family:'Playfair Display',serif;font-size:18px;color:#C9A84C;margin-bottom:6px}
.card-desc{font-size:12px;color:#555;line-height:1.6}
</style>
</head>
<body>
<div class="logo">ONESCALP</div>
<div class="sub">ESPACE DE GESTION</div>
<div class="cards">
  <a class="card" href="/Onescalp-toils/crm.html">
    <div class="card-icon">👤</div>
    <div class="card-title">CRM Leads</div>
    <div class="card-desc">Suivi des prospects, statuts, sources et checklist</div>
  </a>
  <a class="card" href="/Onescalp-toils/finance.html">
    <div class="card-icon">📊</div>
    <div class="card-title">Suivi Financier</div>
    <div class="card-desc">CA, dépenses et résultat mensuel par studio</div>
  </a>
</div>
</body>
</html>
